<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜狗词库清理</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --line: #e3e3e8; --line-strong: #d0d0d7;
  --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
  --accent: #0a66d8; --accent-text: #ffffff; --sel: #dce9fb; --sel-strong: #c4dafa; --hover: #f2f4f8;
  --danger: #c62828; --danger-bg: #fdecea; --mark: #ffe08a; --mark-text: #6b3f00;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --t-red: #c62828; --t-orange: #c25400; --t-purple: #7b3fb5; --t-violet: #8e6cc4; --t-amber: #9a6a00;
  --t-blue: #1f5fbf; --t-teal: #0f7a72; --t-gray: #6e6e73;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e; --panel: #232326; --line: #333338; --line-strong: #44444a;
    --text: #f2f2f7; --muted: #a1a1a8; --faint: #6e6e73;
    --accent: #3d8bfd; --sel: #1f3a5f; --sel-strong: #28497a; --hover: #2b2b30;
    --danger: #ff6b6b; --danger-bg: #3a1f1f; --mark: #7a5a00; --mark-text: #ffe7a3;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --t-red: #ff7b72; --t-orange: #ffa657; --t-purple: #c39bf0; --t-violet: #b6a1e6; --t-amber: #e3b341;
    --t-blue: #79b8ff; --t-teal: #56d4c4; --t-gray: #a1a1a8;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px;
  padding: 3px 10px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 1px 8px; font-size: 12px; }
input[type=search], input[type=number] {
  font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 6px; padding: 3px 8px; outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
input[type=number] { width: 52px; padding: 2px 4px; text-align: right; }

/* 顶栏 */
header { display: flex; align-items: center; gap: 12px; padding: 10px 14px 8px; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .file { color: var(--muted); max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .spacer { flex: 1; }
#search { width: 280px; }
#saveState { color: var(--faint); font-size: 12px; min-width: 52px; text-align: right; }

/* 筛选工具栏 */
.toolbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px;
}
.toolbar .label { color: var(--muted); margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong);
  background: var(--panel); border-radius: 999px; padding: 2px 4px 2px 10px; cursor: pointer;
}
.chip:hover:not(.empty) { border-color: var(--accent); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip .count { background: var(--bg); color: var(--muted); border-radius: 999px; padding: 0 7px; font-size: 12px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.chip.empty { opacity: .45; cursor: default; }
.chip input { margin: 0 -2px 0 0; }
.toolbar .sep { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }
.toolbar label.opt { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }

/* 三栏 */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; padding: 0 14px; }
.right { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
.pane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; outline: none; overflow: hidden;
}
.pane:focus-within, .pane:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.pane-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
.pane-head .badge { color: var(--muted); font-variant-numeric: tabular-nums; }
.pane-head .spacer { flex: 1; }
.pane[data-pane="2"] .pane-head h2 { color: var(--danger); }

.cols, .row { display: grid; grid-template-columns: minmax(90px, 2fr) minmax(90px, 2fr) 64px 44px minmax(80px, 1.6fr); }
.cols { border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; user-select: none; }
.cols > div { padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.cols > div:hover { color: var(--text); }
.cols > div.sorted { color: var(--text); font-weight: 600; }
.cols > div.num, .row > .num { text-align: right; }
.body { flex: 1; overflow-y: auto; position: relative; min-height: 0; }
.spacer-y { width: 1px; }
.row {
  position: absolute; left: 0; right: 0; height: 26px; align-items: center; cursor: default;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); user-select: none;
}
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row.cur { box-shadow: inset 2px 0 0 var(--accent); }
.pane:focus .row.sel, .pane:focus-within .row.sel { background: var(--sel-strong); }
.row > div { padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .w { font-size: 14px; }
.row .w mark { background: var(--mark); color: var(--mark-text); border-radius: 2px; padding: 0 1px; }
.row .py { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.row .num { font-variant-numeric: tabular-nums; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; margin-right: 3px;
  border: 1px solid currentColor; opacity: .9; }
.empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint);
  text-align: center; padding: 20px; pointer-events: none; line-height: 1.8; }

footer { display: flex; align-items: center; gap: 16px; padding: 8px 14px; color: var(--muted); font-size: 12px; }
footer .spacer { flex: 1; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }

/* 提示条与对话框 */
#toast {
  position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: center;
  transition: .18s; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 80vw;
}
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#toast button { background: none; border: none; color: var(--accent); filter: brightness(1.4); cursor: pointer; font-weight: 600; padding: 0; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; }
.modal-back.show { display: flex; }
.modal { background: var(--panel); border-radius: 12px; padding: 20px 22px; width: min(520px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal h3 { margin: 0 0 10px; font-size: 16px; }
.modal p { margin: 8px 0; color: var(--muted); }
.modal .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.modal .stats b { text-align: right; }
.modal code { font-size: 12px; word-break: break-all; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--bg); }
</style>
</head>
<body>
<div class="loading" id="loading">正在载入词库…</div>

<header>
  <h1>搜狗词库清理</h1>
  <span class="file" id="fileName"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="搜索词或拼音（/正则/）" autocomplete="off" spellcheck="false">
  <span id="saveState"></span>
  <button class="btn" id="undoBtn" title="撤销 (⌘Z)" disabled>撤销</button>
  <button class="btn primary" id="exportBtn">导出干净词库</button>
</header>

<div class="toolbar" id="toolbar">
  <span class="label">筛到备选：</span>
</div>

<main>
  <section class="pane" data-pane="0" tabindex="0">
    <div class="pane-head">
      <h2>现有词库</h2><span class="badge" data-badge></span><span class="spacer"></span>
      <button class="btn small" data-act="toCand" title="Delete">移到备选 →</button>
    </div>
    <div class="cols"></div>
    <div class="body"><div class="spacer-y"></div></div>
  </section>
  <div class="right">
    <section class="pane" data-pane="1" tabindex="0">
      <div class="pane-head">
        <h2>备选移除</h2><span class="badge" data-badge></span><span class="spacer"></span>
        <button class="btn small" data-act="keep" title="R">← 保留</button>
        <button class="btn small danger" data-act="toRemove" title="Delete">确认移除 ↓</button>
      </div>
      <div class="cols"></div>
      <div class="body"><div class="spacer-y"></div><div class="empty-hint">用上方的筛选按钮把可疑词条放进这里，<br>再逐条决定保留还是移除。</div></div>
    </section>
    <section class="pane" data-pane="2" tabindex="0">
      <div class="pane-head">
        <h2>确认移除</h2><span class="badge" data-badge></span><span class="spacer"></span>
        <button class="btn small" data-act="keep" title="R">← 保留</button>
        <button class="btn small" data-act="backToCand" title="Backspace">↑ 退回备选</button>
      </div>
      <div class="cols"></div>
      <div class="body"><div class="spacer-y"></div><div class="empty-hint">导出时，这里的词条会从词库中删除。</div></div>
    </section>
  </div>
</main>

<footer>
  <span>单击选择 · <kbd>⇧</kbd> 连选 · <kbd>⌘</kbd> 加选 · <kbd>⌘A</kbd> 全选 · <kbd>↑</kbd><kbd>↓</kbd> 移动</span>
  <span><kbd>Delete</kbd> 往移除方向 · <kbd>R</kbd> 保留 · 双击移动 · <kbd>⌘Z</kbd> 撤销</span>
  <span class="spacer"></span>
  <span id="summary"></span>
</footer>

<div id="toast"><span id="toastText"></span><button id="toastUndo">撤销</button></div>

<div class="modal-back" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const ROW_H = 26;
const PANE_NAMES = ["现有词库", "备选移除", "确认移除"];

// 与 sogou_gui.py 的标签位对应
const TAGS = [
  { bit: 1 << 0, name: "乱码", color: "--t-red" },
  { bit: 1 << 1, name: "汉字乱码", color: "--t-orange" },
  { bit: 1 << 2, name: "生僻字", color: "--t-purple" },
  { bit: 1 << 3, name: "次常用字", color: "--t-violet" },
  { bit: 1 << 4, name: "拼音不符", color: "--t-amber" },
  { bit: 1 << 5, name: "人名", color: "--t-blue" },
  { bit: 1 << 6, name: "英文数字", color: "--t-teal" },
  { bit: 1 << 7, name: "多拼音", color: "--t-gray" },
];

let rows = [];          // [词, 拼音, 词频, 标签位, 可疑字位置]
let N = 0;
let loc;                // Uint8Array: 0 现有, 1 备选, 2 移除
let lens;               // 字数
const undoStack = [];
let searchFn = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("zh-CN");

// ---------- 筛选器 ----------
const opts = { long: 6, low: 1, protect: 100, protectOn: false };
const FILTERS = [
  { key: "garbled", label: "乱码", color: "--t-red", tip: "含非汉字、非 ASCII 的字符，或文字无法解码", test: i => rows[i][3] & 1 },
  { key: "han", label: "汉字乱码", color: "--t-orange", tip: "全是汉字，但几乎每个字的读音都对不上（如「埥䤅靨」读作 he kuang hai）", test: i => rows[i][3] & 2 },
  { key: "rare3", label: "生僻字", color: "--t-purple", tip: "含 GB2312 以外的字", test: i => rows[i][3] & 4 },
  { key: "rare2", label: "次常用字", color: "--t-violet", tip: "含 GB2312 二级字（次常用字），正常词也不少，请逐条确认", test: i => rows[i][3] & 8 },
  { key: "py", label: "拼音对不上", color: "--t-amber", tip: "字数和音节数不一致（这类词按正常拼音打不出来），或某个字的读音在整本词库里只出现在这个词中", test: i => rows[i][3] & 16 },
  { key: "name", label: "疑似人名", color: "--t-blue", tip: "姓 + 名的组合，规则粗略，请逐条确认", test: i => rows[i][3] & 32 },
  { key: "latin", label: "英文/数字", color: "--t-teal", tip: "含英文字母或数字", test: i => rows[i][3] & 64 },
  { key: "multi", label: "多种拼音", color: "--t-gray", tip: "同一个词以多种拼音出现", test: i => rows[i][3] & 128 },
  { key: "long", label: "长句", color: "--t-gray", tip: "字数不少于设定值，多半是整句输入", param: "long", test: i => lens[i] >= opts.long },
  { key: "low", label: "低频", color: "--t-gray", tip: "词频不高于设定值", param: "low", test: i => rows[i][2] <= opts.low },
  { key: "search", label: "搜索结果", color: "--t-gray", tip: "当前搜索框匹配到的词", test: i => searchFn && searchFn(i) },
];

function protectedRow(i) { return opts.protectOn && rows[i][2] >= opts.protect; }

function buildToolbar() {
  const bar = $("#toolbar");
  for (const f of FILTERS) {
    const chip = document.createElement("span");
    chip.className = "chip"; chip.title = f.tip; chip.dataset.key = f.key;
    let html = `<span class="dot" style="background:var(${f.color})"></span>${f.label}`;
    if (f.param === "long") html += ` ≥<input type="number" min="2" max="99" value="${opts.long}" data-param="long">字`;
    if (f.param === "low") html += ` ≤<input type="number" min="0" max="65535" value="${opts.low}" data-param="low">`;
    html += `<span class="count">0</span>`;
    chip.innerHTML = html;
    chip.addEventListener("click", e => { if (e.target.tagName !== "INPUT") applyFilter(f); });
    bar.appendChild(chip);
    if (f.key === "multi") bar.insertAdjacentHTML("beforeend", '<span class="sep"></span>');
  }
  bar.insertAdjacentHTML("beforeend", `<span class="sep"></span>
    <label class="opt" title="批量筛选时跳过高频词，避免误删常用词"><input type="checkbox" id="protectOn">保护词频 ≥
    <input type="number" id="protect" min="1" max="65535" value="${opts.protect}"></label>`);
  bar.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.param) opts[t.dataset.param] = Math.max(0, parseInt(t.value || "0", 10));
    if (t.id === "protect") opts.protect = Math.max(1, parseInt(t.value || "1", 10));
    if (t.id === "protectOn") opts.protectOn = t.checked;
    updateCounts();
  });
}

function updateCounts() {
  const counts = FILTERS.map(() => 0);
  for (let i = 0; i < N; i++) {
    if (loc[i] !== 0 || protectedRow(i)) continue;
    for (let k = 0; k < FILTERS.length; k++) if (FILTERS[k].test(i)) counts[k]++;
  }
  FILTERS.forEach((f, k) => {
    const chip = $(`.chip[data-key="${f.key}"]`);
    $(".count", chip).textContent = fmt(counts[k]);
    chip.classList.toggle("empty", counts[k] === 0);
  });
}

function applyFilter(f) {
  const ids = [];
  for (let i = 0; i < N; i++) if (loc[i] === 0 && !protectedRow(i) && f.test(i)) ids.push(i);
  if (!ids.length) return;
  move(ids, 1, `已将「${f.label}」${fmt(ids.length)} 条移到备选`);
  panes[1].sel = new Set(); panes[1].el.focus();
}

// ---------- 搜索 ----------
function setSearch(q) {
  q = q.trim();
  if (!q) searchFn = null;
  else if (q.length > 2 && q.startsWith("/") && q.endsWith("/")) {
    try {
      const re = new RegExp(q.slice(1, -1));
      searchFn = i => re.test(rows[i][0]) || re.test(rows[i][1]);
      $("#search").style.borderColor = "";
    } catch { $("#search").style.borderColor = "var(--danger)"; return; }
  } else {
    const ql = q.toLowerCase().replace(/\s+/g, " ");
    // 带空格时按完整音节匹配（「ha ha」不会匹配 cha hao），不带空格时连写模糊匹配
    const pyMatch = ql.includes(" ")
      ? i => (" " + rows[i][1] + " ").includes(" " + ql + " ")
      : i => rows[i][1].replace(/ /g, "").includes(ql);
    searchFn = i => rows[i][0].toLowerCase().includes(ql) || pyMatch(i);
  }
  panes.forEach(p => p.refresh());
  updateCounts();
}

// ---------- 排序 ----------
const COLS = [
  { key: "word", label: "词" }, { key: "py", label: "拼音" },
  { key: "rank", label: "词频", num: true }, { key: "len", label: "字数", num: true }, { key: "tags", label: "标签" },
];
const sortKeys = {};    // key -> Int32Array 名次（id -> 位置）
function sortKey(key) {
  if (sortKeys[key]) return sortKeys[key];
  const ids = Array.from({ length: N }, (_, i) => i);
  if (key === "word") {
    const coll = new Intl.Collator("zh-Hans-CN-u-co-pinyin");
    ids.sort((a, b) => coll.compare(rows[a][0], rows[b][0]) || a - b);
  } else if (key === "py") ids.sort((a, b) => (rows[a][1] < rows[b][1] ? -1 : rows[a][1] > rows[b][1] ? 1 : a - b));
  else if (key === "rank") ids.sort((a, b) => rows[a][2] - rows[b][2] || a - b);
  else if (key === "len") ids.sort((a, b) => lens[a] - lens[b] || a - b);
  else if (key === "tags") ids.sort((a, b) => rows[b][3] - rows[a][3] || a - b);
  const r = new Int32Array(N);
  ids.forEach((id, k) => (r[id] = k));
  return (sortKeys[key] = r);
}

// ---------- 栏 ----------
class Pane {
  constructor(el, idx) {
    this.el = el; this.idx = idx;
    this.body = $(".body", el); this.spacer = $(".spacer-y", el); this.hint = $(".empty-hint", el);
    this.badge = $("[data-badge]", el);
    this.view = []; this.sel = new Set(); this.anchor = -1; this.cursor = -1;
    this.sort = { key: idx === 0 ? null : "tags", dir: 1 };
    this.rowPool = [];
    this.buildCols();
    this.body.addEventListener("scroll", () => this.render());
    this.body.addEventListener("mousedown", e => this.onMouseDown(e));
    this.body.addEventListener("dblclick", e => this.onDblClick(e));
    el.addEventListener("keydown", e => this.onKey(e));
    new ResizeObserver(() => this.render()).observe(this.body);
    el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => actions[b.dataset.act](this)));
  }
  buildCols() {
    const cols = $(".cols", this.el);
    cols.innerHTML = COLS.map(c => `<div data-key="${c.key}" class="${c.num ? "num" : ""}">${c.label}</div>`).join("");
    cols.addEventListener("click", e => {
      const k = e.target.closest("[data-key]")?.dataset.key; if (!k) return;
      if (this.sort.key === k) {
        if (this.sort.dir === 1) this.sort.dir = -1; else this.sort = { key: null, dir: 1 };
      } else this.sort = { key: k, dir: k === "rank" && this.idx === 0 ? -1 : 1 };
      this.refresh(); this.el.focus();
    });
  }
  refresh() {
    const v = [];
    for (let i = 0; i < N; i++) if (loc[i] === this.idx && (!searchFn || searchFn(i))) v.push(i);
    if (this.sort.key) { const r = sortKey(this.sort.key), d = this.sort.dir; v.sort((a, b) => (r[a] - r[b]) * d); }
    this.view = v;
    for (const id of this.sel) if (loc[id] !== this.idx) this.sel.delete(id);
    $(".cols", this.el).querySelectorAll("[data-key]").forEach(c => {
      const on = c.dataset.key === this.sort.key;
      c.classList.toggle("sorted", on);
      c.textContent = COLS.find(x => x.key === c.dataset.key).label + (on ? (this.sort.dir === 1 ? " ↑" : " ↓") : "");
    });
    this.spacer.style.height = v.length * ROW_H + "px";
    if (this.hint) this.hint.style.display = v.length ? "none" : "";
    this.render(); this.updateHead();
  }
  updateHead() {
    let total = 0; for (let i = 0; i < N; i++) if (loc[i] === this.idx) total++;
    const shown = this.view.length;
    this.badge.textContent = (shown !== total ? `${fmt(shown)} / ` : "") + fmt(total) + (this.sel.size ? ` · 已选 ${fmt(this.sel.size)}` : "");
    const has = this.sel.size > 0;
    this.el.querySelectorAll("[data-act]").forEach(b => (b.disabled = !has));
  }
  render() {
    const top = this.body.scrollTop, h = this.body.clientHeight;
    const start = Math.max(0, Math.floor(top / ROW_H) - 5), end = Math.min(this.view.length, Math.ceil((top + h) / ROW_H) + 5);
    let html = "";
    for (let k = start; k < end; k++) {
      const id = this.view[k], r = rows[id];
      const cls = "row" + (this.sel.has(id) ? " sel" : "") + (id === this.cursor ? " cur" : "");
      html += `<div class="${cls}" data-id="${id}" style="top:${k * ROW_H}px">`
        + `<div class="w" title="${esc(r[0])}">${wordHtml(r)}</div>`
        + `<div class="py" title="${esc(r[1])}">${esc(r[1])}</div>`
        + `<div class="num">${r[2]}</div><div class="num">${lens[id]}</div>`
        + `<div class="tags" title="${TAGS.filter(g => r[3] & g.bit).map(g => g.name).join("、")}">${tagsHtml(r[3])}</div></div>`;
    }
    // 只替换行，保留 spacer 与提示
    this.body.querySelectorAll(".row").forEach(n => n.remove());
    this.body.insertAdjacentHTML("beforeend", html);
  }
  posOf(id) { return this.view.indexOf(id); }
  setCursor(id, scroll = true) {
    this.cursor = id;
    if (scroll && id >= 0) {
      const k = this.posOf(id), y = k * ROW_H, b = this.body;
      if (y < b.scrollTop) b.scrollTop = y;
      else if (y + ROW_H > b.scrollTop + b.clientHeight) b.scrollTop = y + ROW_H - b.clientHeight;
    }
  }
  selectRange(fromId, toId, add) {
    const a = this.posOf(fromId), b = this.posOf(toId);
    if (!add) this.sel.clear();
    if (a < 0) { this.sel.add(toId); return; }
    for (let k = Math.min(a, b); k <= Math.max(a, b); k++) this.sel.add(this.view[k]);
  }
  onMouseDown(e) {
    const row = e.target.closest(".row"); if (!row) return;
    const id = +row.dataset.id, meta = e.metaKey || e.ctrlKey;
    if (e.shiftKey) this.selectRange(this.anchor >= 0 ? this.anchor : id, id, meta);
    else if (meta) { this.sel.has(id) ? this.sel.delete(id) : this.sel.add(id); this.anchor = id; }
    else if (!(e.detail === 2 && this.sel.has(id))) { this.sel = new Set([id]); this.anchor = id; }
    this.setCursor(id, false);
    this.el.focus({ preventScroll: true });
    this.render(); this.updateHead();
  }
  onDblClick(e) {
    const row = e.target.closest(".row"); if (!row) return;
    const id = +row.dataset.id;
    move([id], this.idx === 0 ? 1 : this.idx === 1 ? 2 : 1);
  }
  onKey(e) {
    const meta = e.metaKey || e.ctrlKey;
    if (meta && e.key.toLowerCase() === "a") { e.preventDefault(); this.sel = new Set(this.view); this.render(); this.updateHead(); return; }
    if (meta) return;
    const v = this.view; if (!v.length) return;
    let k = this.posOf(this.cursor);
    const page = Math.max(1, Math.floor(this.body.clientHeight / ROW_H) - 1);
    const nav = { ArrowDown: 1, ArrowUp: -1, PageDown: page, PageUp: -page, Home: -1e9, End: 1e9 }[e.key];
    if (nav !== undefined) {
      e.preventDefault();
      k = k < 0 ? 0 : Math.max(0, Math.min(v.length - 1, k + nav));
      const id = v[k];
      if (e.shiftKey) this.selectRange(this.anchor >= 0 ? this.anchor : id, id, false);
      else { this.sel = new Set([id]); this.anchor = id; }
      this.setCursor(id); this.render(); this.updateHead();
    } else if (e.key === "Delete" || e.key === "Backspace" || e.key === "d") {
      e.preventDefault();
      if (this.idx === 0) actions.toCand(this);
      else if (this.idx === 1) actions.toRemove(this);
      else if (e.key === "Backspace") actions.backToCand(this);
    } else if (e.key === "r" || e.key === "k") { e.preventDefault(); if (this.idx > 0) actions.keep(this); }
    else if (e.key === "Escape") { this.sel.clear(); this.render(); this.updateHead(); }
  }
  // 移动后让光标停在原来的位置附近，方便连续操作
  takeSelection() {
    const ids = this.view.filter(id => this.sel.has(id));
    if (!ids.length) return [];
    const firstPos = this.posOf(ids[0]);
    const rest = this.view.filter(id => !this.sel.has(id));
    const next = rest[Math.min(firstPos, rest.length - 1)];
    this.sel = new Set(next !== undefined ? [next] : []);
    this.anchor = this.cursor = next !== undefined ? next : -1;
    return ids;
  }
}

function wordHtml(r) {
  const w = r[0], bad = r[4];
  if (!bad || !bad.length) return esc(w);
  const chars = Array.from(w), set = new Set(bad);
  return chars.map((c, i) => (set.has(i) ? `<mark>${esc(c)}</mark>` : esc(c))).join("");
}
function tagsHtml(t) {
  if (!t) return "";
  let s = "";
  for (const g of TAGS) if (t & g.bit) s += `<span class="tag" style="color:var(${g.color})">${g.name}</span>`;
  return s;
}

const actions = {
  toCand: p => { const ids = p.takeSelection(); if (ids.length) move(ids, 1, `${fmt(ids.length)} 条移到备选`); },
  toRemove: p => { const ids = p.takeSelection(); if (ids.length) move(ids, 2, `${fmt(ids.length)} 条确认移除`); },
  keep: p => { const ids = p.takeSelection(); if (ids.length) move(ids, 0, `${fmt(ids.length)} 条已保留`); },
  backToCand: p => { const ids = p.takeSelection(); if (ids.length) move(ids, 1, `${fmt(ids.length)} 条退回备选`); },
};

// ---------- 移动、撤销、保存 ----------
function move(ids, to, msg) {
  const prev = new Uint8Array(ids.length);
  ids.forEach((id, k) => { prev[k] = loc[id]; loc[id] = to; });
  undoStack.push({ ids, prev });
  if (undoStack.length > 200) undoStack.shift();
  afterChange();
  if (msg) toast(msg, true);
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  u.ids.forEach((id, k) => (loc[id] = u.prev[k]));
  afterChange();
  toast(`已撤销（${fmt(u.ids.length)} 条）`, false);
}
function afterChange() {
  panes.forEach(p => p.refresh());
  updateCounts(); updateSummary();
  $("#undoBtn").disabled = !undoStack.length;
  scheduleSave();
}
function updateSummary() {
  const c = [0, 0, 0]; for (let i = 0; i < N; i++) c[loc[i]]++;
  $("#summary").textContent = `导出后将保留 ${fmt(c[0] + c[1])} 条，移除 ${fmt(c[2])} 条`;
}

let saveTimer = null;
function scheduleSave() {
  $("#saveState").textContent = "未保存";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 600);
}
async function save() {
  const candidates = [], removed = [];
  for (let i = 0; i < N; i++) { if (loc[i] === 1) candidates.push(i); else if (loc[i] === 2) removed.push(i); }
  try {
    await api("/api/state", { candidates, removed });
    $("#saveState").textContent = "已保存";
  } catch (e) { $("#saveState").textContent = "保存失败"; }
}
async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer = null;
function toast(msg, canUndo) {
  $("#toastText").textContent = msg;
  $("#toastUndo").style.display = canUndo ? "" : "none";
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 3500);
}

// ---------- 导出 ----------
function showModal(html) { $("#modalBody").innerHTML = html; $("#modal").classList.add("show"); }
function hideModal() { $("#modal").classList.remove("show"); }
function exportDialog() {
  const c = [0, 0, 0]; for (let i = 0; i < N; i++) c[loc[i]]++;
  showModal(`<h3>导出干净词库</h3>
    <div class="stats">
      <span>保留</span><b>${fmt(c[0] + c[1])} 条</b>
      <span>移除（确认移除栏）</span><b>${fmt(c[2])} 条</b>
    </div>
    ${c[1] ? `<p>备选栏里还有 <b>${fmt(c[1])}</b> 条未处理，导出时会<b>保留</b>。</p>` : ""}
    <p>会在备份文件旁边生成新的 <code>.bin</code>（用于搜狗「恢复」）和 <code>.txt</code>，原始备份不会被修改。</p>
    <div class="actions"><button class="btn" data-close>取消</button><button class="btn primary" id="doExport" ${c[2] ? "" : "disabled"}>导出</button></div>`);
  $("#doExport").onclick = doExport;
}
async function doExport() {
  const removed = []; for (let i = 0; i < N; i++) if (loc[i] === 2) removed.push(i);
  $("#doExport").disabled = true; $("#doExport").textContent = "导出中…";
  try {
    const r = await api("/api/export", { removed });
    showModal(`<h3>导出完成</h3>
      <div class="stats"><span>保留</span><b>${fmt(r.kept)} 条</b><span>移除</span><b>${fmt(r.removed)} 条</b></div>
      <p>词库文件：<br><code>${esc(r.bin)}</code></p>
      <p>文本版：<br><code>${esc(r.txt)}</code></p>
      <p>在搜狗输入法「偏好设置 › 词库 › 中文用户词库」里用「恢复（完全覆盖）」选择上面的 .bin。如果提示失败，见 README 里的「文件权限」一节。</p>
      <div class="actions"><button class="btn primary" data-close>好</button></div>`);
  } catch (e) {
    showModal(`<h3>导出失败</h3><p>${esc(e.message)}</p><div class="actions"><button class="btn" data-close>关闭</button></div>`);
  }
}

// ---------- 启动 ----------
let panes = [];
async function init() {
  buildToolbar();
  const data = await api("/api/data");
  rows = data.rows; N = rows.length;
  loc = new Uint8Array(N);
  lens = new Uint16Array(N);
  for (let i = 0; i < N; i++) lens[i] = Array.from(rows[i][0]).length;
  for (const i of data.state.candidates || []) if (i < N) loc[i] = 1;
  for (const i of data.state.removed || []) if (i < N) loc[i] = 2;
  $("#fileName").textContent = data.file;
  document.title = `${data.file} · 搜狗词库清理`;
  panes = [...document.querySelectorAll(".pane")].map((el, k) => new Pane(el, k));
  panes.forEach(p => p.refresh());
  updateCounts(); updateSummary();
  $("#saveState").textContent = "已保存";
  $("#loading").remove();
  panes[0].el.focus();
}

let searchTimer = null;
$("#search").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => setSearch(e.target.value), 180); });
$("#undoBtn").onclick = undo;
$("#toastUndo").onclick = () => { undo(); };
$("#exportBtn").onclick = exportDialog;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" || e.target.dataset.close !== undefined) hideModal(); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.shiftKey && document.activeElement.tagName !== "INPUT") { e.preventDefault(); undo(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("#search").focus(); $("#search").select(); }
  if (e.key === "Escape" && $("#modal").classList.contains("show")) hideModal();
});
init().catch(e => { $("#loading").textContent = "载入失败：" + e.message; });
</script>
</body>
